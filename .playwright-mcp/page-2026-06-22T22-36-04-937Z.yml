      - generic [ref=e60]:
        - heading "Common Questions" [level=2] [ref=e61]
        - generic [ref=e62]:
          - generic [ref=e63]:
            - heading "Is it too hot to walk my dog?" [level=3] [ref=e64]
            - paragraph [ref=e65]: "A good rule of thumb: if the air temperature is above 77F, check the pavement first. Asphalt in direct sun can reach 125F or more even when the air feels manageable. Use the checker above to get a real-time read for your city."
          - generic [ref=e66]:
            - heading "How hot is too hot for pavement?" [level=3] [ref=e67]
            - paragraph [ref=e68]: Research published in JAMA (Berens, 1970) found that 77F air produced 125F asphalt in direct sun. Paw pads can sustain burns in under 60 seconds at that temperature. Shade buys some margin, but asphalt still runs 10 to 15 degrees above air temp in the shade.
          - generic [ref=e69]:
            - heading "What temperature is dangerous for dogs?" [level=3] [ref=e70]
            - paragraph [ref=e71]: The heat index - air temperature adjusted for humidity - is the more accurate risk signal than raw temperature alone. A heat index above 85F is caution territory for most dogs. Above 90F is dangerous, and above that the risk of heatstroke rises fast. Brachycephalic breeds, seniors, dark-coated dogs, and overweight dogs reach that threshold sooner.
