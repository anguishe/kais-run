name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
          NEXT_PUBLIC_CLARITY_ID: ${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
          NEXT_PUBLIC_GOOGLE_ADS_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_ADS_ID }}
          NEXT_PUBLIC_SUBSCRIBE_URL: ${{ secrets.NEXT_PUBLIC_SUBSCRIBE_URL }}
          NEXT_PUBLIC_FOUNDING_ATHLETE_LABEL: ${{ secrets.NEXT_PUBLIC_FOUNDING_ATHLETE_LABEL }}
          NEXT_PUBLIC_INTRO_SESSION_LABEL: ${{ secrets.NEXT_PUBLIC_INTRO_SESSION_LABEL }}
          NEXT_PUBLIC_MEMBERSHIP_LABEL: ${{ secrets.NEXT_PUBLIC_MEMBERSHIP_LABEL }}
          NEXT_PUBLIC_LEAD_CAPTURE_LABEL: ${{ secrets.NEXT_PUBLIC_LEAD_CAPTURE_LABEL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
